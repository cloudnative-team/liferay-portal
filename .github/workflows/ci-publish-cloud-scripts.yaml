concurrency:
    cancel-in-progress: true
    group: publish-lcd-cloud-scripts-${{github.ref_name}}
defaults:
    run:
        shell: bash
jobs:
    publish-liferay-aws-bootstrap:
        env:
            BOOTSTRAP_STORAGE_PATH_NONPRD: ${{vars.BOOTSTRAP_STORAGE_PATH_NONPRD}}
            BOOTSTRAP_STORAGE_PATH_PRD: ${{vars.BOOTSTRAP_STORAGE_PATH_PRD}}
        if: github.repository == 'cloudnative-team/liferay-portal'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 1
                    fetch-tags: true
                    sparse-checkout: |
                        cloud/scripts
                        cloud/terraform/aws
            -   name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v3
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
                    workload_identity_provider: ${{secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_EXTERNAL_NONPRD}}
            -   name: Set up Google Cloud CLI
                uses: google-github-actions/setup-gcloud@v2
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
            -   name: Set up variables
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local base_version

                        base_version=$(jq --raw-output '."liferay-aws-bootstrap"' ./cloud/scripts/versions.json)

                        local sanitized_branch

                        sanitized_branch=$(echo "${GITHUB_REF_NAME}" | sed 's|/|-|g')

                        local short_sha

                        short_sha=$(git rev-parse --short HEAD)

                        local current_version="${base_version}-${sanitized_branch}-${short_sha}"

                        echo "CURRENT_VERSION=${current_version}" >> ${GITHUB_ENV}

                        local bootstrap_storage_path="${BOOTSTRAP_STORAGE_PATH_NONPRD}"

                        if [[ "${GITHUB_REF_NAME}" == release/* ]] && git tag --points-at HEAD | grep --quiet "^release/"
                        then
                            bootstrap_storage_path="${BOOTSTRAP_STORAGE_PATH_PRD}"
                        fi

                        local gcs_path="${bootstrap_storage_path}/liferay-aws-bootstrap/liferay-aws-bootstrap-${current_version}.tar.gz"

                        echo "GCS_PATH=${gcs_path}" >> ${GITHUB_ENV}
                    }

                    main "${@}"
            -   name: Package and push AWS bootstrap scripts
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        echo "Overwriting preview ${CURRENT_VERSION} if it exists."

                        tar \
                            --create \
                            --file /tmp/liferay-aws-bootstrap-${CURRENT_VERSION}.tar.gz \
                            --gzip \
                            --verbose \
                            cloud/scripts/setup_aws.sh \
                            cloud/scripts/versions_aws.tfvars \
                            cloud/terraform/aws/eks/* \
                            cloud/terraform/aws/gitops/platform/* \
                            cloud/terraform/aws/gitops/resources/* \
                            cloud/terraform/aws/grafana/*

                        gcloud storage cp \
                            /tmp/liferay-aws-bootstrap-${CURRENT_VERSION}.tar.gz \
                            ${GCS_PATH}
                    }

                    main "${@}"
    publish-liferay-gcp-bootstrap:
        env:
            BOOTSTRAP_STORAGE_PATH_NONPRD: ${{vars.BOOTSTRAP_STORAGE_PATH_NONPRD}}
            BOOTSTRAP_STORAGE_PATH_PRD: ${{vars.BOOTSTRAP_STORAGE_PATH_PRD}}
        if: github.repository == 'cloudnative-team/liferay-portal'
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 1
                    fetch-tags: true
                    sparse-checkout: |
                        cloud/scripts
                        cloud/terraform/gcp
            -   name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v3
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
                    workload_identity_provider: ${{secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_EXTERNAL_NONPRD}}
            -   name: Set up Google Cloud CLI
                uses: google-github-actions/setup-gcloud@v2
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
            -   name: Set up variables
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local base_version

                        base_version=$(jq --raw-output '."liferay-gcp-bootstrap"' ./cloud/scripts/versions.json)

                        local sanitized_branch

                        sanitized_branch=$(echo "${GITHUB_REF_NAME}" | sed 's|/|-|g')

                        local short_sha

                        short_sha=$(git rev-parse --short HEAD)

                        local current_version="${base_version}-${sanitized_branch}-${short_sha}"

                        echo "CURRENT_VERSION=${current_version}" >> ${GITHUB_ENV}

                        local bootstrap_storage_path="${BOOTSTRAP_STORAGE_PATH_NONPRD}"

                        if [[ "${GITHUB_REF_NAME}" == release/* ]] && git tag --points-at HEAD | grep --quiet "^release/"
                        then
                            bootstrap_storage_path="${BOOTSTRAP_STORAGE_PATH_PRD}"
                        fi

                        local gcs_path="${bootstrap_storage_path}/liferay-gcp-bootstrap/liferay-gcp-bootstrap-${current_version}.tar.gz"

                        echo "GCS_PATH=${gcs_path}" >> ${GITHUB_ENV}
                    }

                    main "${@}"
            -   name: Package and push GCP bootstrap scripts
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        echo "Overwriting preview ${CURRENT_VERSION} if it exists."

                        tar \
                            --create \
                            --file /tmp/liferay-gcp-bootstrap-${CURRENT_VERSION}.tar.gz \
                            --gzip \
                            --verbose \
                            cloud/scripts/setup_gcp.sh \
                            cloud/scripts/versions_gcp.tfvars \
                            cloud/terraform/gcp/gitops/platform/* \
                            cloud/terraform/gcp/gitops/resources/* \
                            cloud/terraform/gcp/gke/*

                        gcloud storage cp \
                            /tmp/liferay-gcp-bootstrap-${CURRENT_VERSION}.tar.gz \
                            ${GCS_PATH}
                    }

                    main "${@}"
on:
    push:
        branches:
            -   LCD-*
            -   release/**
        paths:
            -   .github/workflows/ci-publish-cloud-scripts.yaml
            -   cloud/scripts/**
            -   cloud/terraform/aws/**
            -   cloud/terraform/gcp/**
permissions:
    contents: read
    id-token: write