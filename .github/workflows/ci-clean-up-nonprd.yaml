defaults:
    run:
        shell: bash
jobs:
    cleanup:
        env:
            BOOTSTRAP_STORAGE_PATH: ${{vars.BOOTSTRAP_STORAGE_PATH_NONPRD}}
            EVENT_REF: ${{github.event.ref}}
            HELM_CHART_REGISTRY: ${{vars.HELM_CHART_REGISTRY_NONPRD}}
        if: |
            github.repository == 'cloudnative-team/liferay-portal' &&
            github.event.ref_type == 'branch' &&
            (
                startsWith(github.event.ref, 'LCD-') ||
                startsWith(github.event.ref, 'release/')
            )
        runs-on: ubuntu-latest
        steps:
            -   name: Authenticate to Google Cloud
                uses: google-github-actions/auth@v3
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
                    workload_identity_provider: ${{secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_EXTERNAL_NONPRD}}
            -   name: Set up Google Cloud CLI
                uses: google-github-actions/setup-gcloud@v2
                with:
                    project_id: ${{secrets.GCP_PROJECT_ID_EXTERNAL_NONPRD}}
            -   name: Delete chart images
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local chart_names=(
                            liferay-aws
                            liferay-aws-infrastructure
                            liferay-aws-infrastructure-provider
                            liferay-default
                            liferay-gcp
                            liferay-gcp-infrastructure
                            liferay-gcp-infrastructure-provider
                        )

                        for chart in "${chart_names[@]}"
                        do
                            local image="${HELM_CHART_REGISTRY}/${EVENT_REF}/${chart}"

                            echo "Deleting ${image}"

                            gcloud artifacts docker images delete \
                                "${image}" \
                                --delete-tags \
                                --quiet \
                                || true
                        done
                    }

                    main "${@}"
            -   name: Delete bootstrap tarballs
                run: |
                    set -o errexit
                    set -o nounset
                    set -o pipefail

                    function main {
                        local sanitized

                        sanitized=$(echo "${EVENT_REF}" | sed 's|/|-|g')

                        if [[ "${EVENT_REF}" == release/* ]]
                        then
                            local path="${BOOTSTRAP_STORAGE_PATH}/${sanitized}/"

                            echo "Deleting ${path} recursively"

                            gcloud storage rm --recursive "${path}" \
                                || true
                        else
                            for provider in aws gcp
                            do
                                local pattern="${BOOTSTRAP_STORAGE_PATH}/liferay-${provider}-bootstrap/liferay-${provider}-bootstrap-*-${sanitized}-g*.tar.gz"

                                echo "Deleting ${pattern}"

                                gcloud storage rm "${pattern}" \
                                    || true
                            done
                        fi
                    }

                    main "${@}"
on:
    delete
permissions:
    contents: read
    id-token: write