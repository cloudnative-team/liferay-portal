defaults:
    run:
        shell: bash
jobs:
    test-cloud-terraform:
        if: ${{(github.event_name == 'pull_request' && github.repository == 'cloudnative-team/liferay-portal') || (github.event_name == 'push' && github.repository == 'liferay/liferay-portal')}}
        permissions:
            checks: write
            contents: read
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
            -   name: Set up Terraform
                uses: hashicorp/setup-terraform@v3
                with:
                    terraform_version: 1.11.4
                    terraform_wrapper: false
            -   name: Set up TFLint
                uses: terraform-linters/setup-tflint@v4
                with:
                    github_token: ${{secrets.GITHUB_TOKEN}}
            -   name: Set up Checkov
                uses: actions/setup-python@v5
                with:
                    python-version: "3.12"
            -   name: Install Checkov
                run: pip install checkov
            -   name: Compute stack id
                env:
                    STACK: ${{matrix.stack}}
                run: echo "STACK_ID=${STACK//\//-}" >> "${GITHUB_ENV}"
            -   name: Run Terraform tests
                run: ./cloud/scripts/tests/run-terraform-tests.sh "${{matrix.stack}}" cloud/test-reports
            -   name: Upload test reports
                if: ${{!cancelled()}}
                uses: actions/upload-artifact@v4
                with:
                    name: terraform-test-reports-${{env.STACK_ID}}
                    path: cloud/test-reports/*.xml
            -   name: Publish test report
                if: ${{!cancelled()}}
                uses: dorny/test-reporter@v2
                with:
                    name: Terraform tests (${{matrix.stack}})
                    path: cloud/test-reports/*.xml
                    reporter: java-junit
        strategy:
            fail-fast: false
            matrix:
                stack:
                    -   aws/dependencies
                    -   aws/ecr
                    -   aws/eks
                    -   aws/gitops/platform
                    -   aws/gitops/resources
                    -   aws/grafana
                    -   gcp/gitops/platform
                    -   gcp/gitops/resources
                    -   gcp/gke
on:
    pull_request:
        paths:
            -   .github/workflows/ci-test-cloud-terraform.yaml
            -   cloud/scripts/tests/**
            -   cloud/terraform/**
    push:
        branches:
            -   master
        paths:
            -   .github/workflows/ci-test-cloud-terraform.yaml
            -   cloud/scripts/tests/**
            -   cloud/terraform/**
