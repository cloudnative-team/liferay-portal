release:
    name: my-release
    namespace: crossplane-system
set:
    database:
        engine: postgresql
suite: Compositions
templates:
    -   templates/compositions.yaml
tests:
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: backupRestoreRole := dig .backupRestoreRole
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: roles/storagetransfer.user
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: ProjectIAMCustomRole
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: roles/cloudsql.admin
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: roles/storagetransfer.admin
        it: Binds the backup restore identity to a shared least privilege role
    -   asserts:
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: backupRestoreCondition := printf .*resource.name.startsWith.*instances/%s-
            -   documentIndex: 0
                matchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: backupRestoreCondition := printf .* .env.projectId .projectId
            -   documentIndex: 0
                notMatchRegex:
                    path: spec.pipeline[1].input.inline.template
                    pattern: backupRestoreCondition := printf .*databaseInstanceNamePrefix
        it: Confines the backup restore identity to the database instances of its own project
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                equal:
                    path: metadata.name
                    value: liferay-infrastructure
            -   documentIndex: 0
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayInfrastructure
            -   documentIndex: 1
                equal:
                    path: metadata.name
                    value: liferay-overlay
            -   documentIndex: 1
                equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayOverlay
        it: Implements the shared Liferay APIs through the packaged function pipeline