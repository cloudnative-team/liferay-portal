release:
    name: my-release
    namespace: crossplane-system
set:
    database:
        engine: postgresql
suite: RBAC
templates:
    -   templates/rbac.yaml
tests:
    -   asserts:
            -   documentIndex: 1
                equal:
                    path: subjects[0].namespace
                    value: custom-system
        it: Follows the release namespace
        release:
            namespace: custom-system