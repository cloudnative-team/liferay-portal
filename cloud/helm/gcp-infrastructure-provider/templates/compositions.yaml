{{- $templates := list -}}
{{- range $path, $_ := .Files.Glob "compositions/**" -}}
    {{- $content := $.Files.Get $path | trim -}}
    {{- if $content -}}
        {{- $templates = append $templates $content -}}
    {{- end -}}
{{- end -}}
{{- $templateHash := join "\n" (sortAlpha $templates) | sha256sum -}}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
        liferay.com/template-hash: {{ $templateHash | quote }}
    labels:
        liferay.com/template-hash: {{ printf "h-%s" $templateHash | trunc 63 | quote }}
    name: liferay-gcp-infrastructure-provider.gcp.liferay.com
spec:
    compositeTypeRef:
        apiVersion: gcp.liferay.com/v1alpha1
        kind: LiferayInfrastructure
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
            step: environment-configs
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                        crossplane = "v2.0.2"
                    source: |
                        {{- .Files.Get "compositions/dist/pipeline.k" | nindent 24 }}
            step: composite-logic
        # Multi-step pipeline prototype: init.k runs as its own function-kcl step
        # instead of inside the bundle. Helm concatenates context_variables.k + the
        # layer body and rewrites `import context_variables as cv` and `cv.` away,
        # so the source arrives at function-kcl as flat KCL with no bundler indent
        # step (eliminates the indent-into-strings bug class). See
        # https://liferay.atlassian.net/wiki/spaces/LC/pages/4871225751.
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- $context := .Files.Get "compositions/context_variables.k" -}}
                        {{- $layer := .Files.Get "compositions/init.k" -}}
                        {{- $merged := printf "%s\n\n%s" $context $layer -}}
                        {{- /* Drop only `import context_variables as cv` -- keep other imports (crypto, etc.). */ -}}
                        {{- $stripped := regexReplaceAll "(?m)^import context_variables as cv\\s*$" $merged "" -}}
                        {{- /* Rewrite cv.xxx -> xxx so the layer code resolves against the inlined context above. */ -}}
                        {{- $flat := regexReplaceAll "\\bcv\\." $stripped "" -}}
                        {{- $flat | nindent 24 }}
            step: init-status
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources