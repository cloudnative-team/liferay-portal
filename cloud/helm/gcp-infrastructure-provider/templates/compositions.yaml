{{- $templates := list -}}
{{- range $path, $_ := .Files.Glob "compositions/**" -}}
    {{- $content := $.Files.Get $path | trim -}}
    {{- if $content -}}
        {{- $templates = append $templates $content -}}
    {{- end -}}
{{- end -}}
{{- $templateHash := join "\n" (sortAlpha $templates) | sha256sum -}}
{{- /* Crossplane Object model (used by every layer that emits Kubernetes resources via the kubernetes provider) */ -}}
{{- $crossplaneObject := list "compositions/models/v1alpha1/kubernetesm_crossplane_io_v1alpha1_object.k" -}}
{{- /* Per-layer model dependency lists -- replaces the bundler's layers table. */ -}}
{{- $backupModels := concat $crossplaneObject (list
    "compositions/models/v1beta1/storage_gcpm_upbound_io_v1beta1_bucket.k"
    "compositions/models/v1beta1/storage_gcpm_upbound_io_v1beta1_bucket_i_a_m_member.k") -}}
{{- $securityModels := list
    "compositions/models/v1beta1/cloudplatform_gcpm_upbound_io_v1beta1_project_i_a_m_member.k"
    "compositions/models/v1beta1/cloudplatform_gcpm_upbound_io_v1beta1_service_account.k"
    "compositions/models/v1beta1/cloudplatform_gcpm_upbound_io_v1beta1_service_account_i_a_m_member.k"
    "compositions/models/v1beta1/kms_gcpm_upbound_io_v1beta1_crypto_key.k"
    "compositions/models/v1beta1/kms_gcpm_upbound_io_v1beta1_crypto_key_i_a_m_member.k"
    "compositions/models/v1beta1/kms_gcpm_upbound_io_v1beta1_key_ring.k" -}}
{{- $sqlModels := list
    "compositions/models/v1beta1/sql_gcpm_upbound_io_v1beta1_database.k"
    "compositions/models/v1beta1/sql_gcpm_upbound_io_v1beta1_database_instance.k"
    "compositions/models/v1beta1/sql_gcpm_upbound_io_v1beta1_user.k" -}}
{{- $storageModels := list
    "compositions/models/v1beta1/storage_gcpm_upbound_io_v1beta1_bucket.k"
    "compositions/models/v1beta1/storage_gcpm_upbound_io_v1beta1_bucket_i_a_m_member.k" -}}
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-50"
        liferay.com/template-hash: {{ $templateHash | quote }}
    labels:
        liferay.com/template-hash: {{ printf "h-%s" $templateHash | trunc 63 | quote }}
    name: liferay-gcp-infrastructure-provider.gcp.liferay.com
spec:
    compositeTypeRef:
        apiVersion: gcp.liferay.com/v1alpha1
        kind: LiferayInfrastructure
    mode: Pipeline
    pipeline:
        -   functionRef:
                name: function-environment-configs
            input:
                apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
                kind: Input
                spec:
                    environmentConfigs:
                        -   ref:
                                name: environment-config
                            type: Reference
            step: environment-configs
        # Each composition layer runs as its own function-kcl step.
        # Source is built at Helm-template time by `kcl.step-source` in
        # _helpers.tpl -- no Python bundler, no schema {layer}_layer wrapper,
        # no indent step that can leak into triple-quoted string literals.
        # See https://liferay.atlassian.net/wiki/spaces/LC/pages/4871225751.
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "init" "models" (list) "aliases" (list)) | nindent 24 }}
            step: init
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "security" "models" $securityModels "aliases" (list "project_iam" "sa" "sa_iam" "kms_key" "kms_iam" "kms_keyring")) | nindent 24 }}
            step: security
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "sql" "models" $sqlModels "aliases" (list "sql_db" "sql_instance" "sql_user")) | nindent 24 }}
            step: sql
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "storage" "models" $storageModels "aliases" (list "gcp" "gcp_iam")) | nindent 24 }}
            step: storage
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "backup" "models" $backupModels "aliases" (list "kubernetes" "storage_bucket" "storage_iam")) | nindent 24 }}
            step: backup
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "overlay" "models" $storageModels "aliases" (list "gcp" "gcp_iam")) | nindent 24 }}
            step: overlay
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "elasticsearch" "models" $crossplaneObject "aliases" (list "kubernetes")) | nindent 24 }}
            step: elasticsearch
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "k8s_resources" "models" $crossplaneObject "aliases" (list "kubernetes")) | nindent 24 }}
            step: k8s_resources
        -   functionRef:
                name: function-kcl
            input:
                apiVersion: template.fn.crossplane.io/v1beta1
                kind: KCLInput
                spec:
                    dependencies: |
                        k8s = "1.32.4"
                    source: |
                        {{- include "kcl.step-source" (dict "root" . "layer" "managed_service_details" "models" $crossplaneObject "aliases" (list "kubernetes")) | nindent 24 }}
            step: managed_service_details
        -   functionRef:
                name: function-auto-ready
            step: auto-detect-ready-composed-resources
