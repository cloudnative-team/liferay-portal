{{- $_ := dig "setup" "database" "engine" "" (.Values.global | default dict) | required "The value \"global.setup.database.engine\" must be set by config.json (setup.database.engine)" -}}
apiVersion: apiextensions.crossplane.io/v1beta1
data:
    databasePrivateDnsZoneId: {{ printf "/subscriptions/%s/resourceGroups/%s/providers/Microsoft.Network/privateDnsZones/%s" $.Values.deploymentContext.subscriptionId $.Values.deploymentContext.resourceGroupName (include "network.databasePrivateDnsZoneName" $) }}
    databaseSubnetId: {{ printf "%s/subnets/%s" (include "network.virtualNetworkId" $) (include "network.databaseSubnetName" $) }}
    {{- range $key := list "deploymentName" "oidcIssuerUrl" "region" "resourceGroupName" "subscriptionId" "tenantId" }}
    {{ $key }}: {{ index $.Values.deploymentContext $key | quote }}
    {{- end }}
    setup:
        {{- dig "setup" dict (.Values.global | default dict) | toYaml | nindent 8 }}
kind: EnvironmentConfig
metadata:
    annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
        argocd.argoproj.io/sync-wave: "-100"
    name: environment-config