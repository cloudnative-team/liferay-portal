release:
    name: my-release
    namespace: crossplane-system
set:
    deploymentContext:
        crossplaneDataClientId: 11111111-1111-1111-1111-111111111111
        crossplaneIamClientId: 22222222-2222-2222-2222-222222222222
        deploymentName: liferay-test
        oidcIssuerUrl: https://oidc.example.com/tenant/
        region: eastus
        resourceGroupName: liferay-test
        subscriptionId: 00000000-0000-0000-0000-000000000000
        tenantId: 33333333-3333-3333-3333-333333333333
    global:
        setup:
            database:
                engine: postgresql
suite: Environment Config
templates:
    -   templates/environment-config.yaml
tests:
    -   asserts:
            -   failedTemplate:
                    errorPattern: The value "global.setup.database.engine" must be set by config.json \(setup.database.engine\)
        it: Fails when the deployment sets no database engine
        set:
            global: null
    -   asserts:
            -   equal:
                    path: data.setup
                    value:
                        database:
                            engine: mysql
                        search:
                            engine: opensearch
        it: Records every setup property of the deployment for the compositions and the engine lock
        set:
            global:
                setup:
                    database:
                        engine: mysql
                    search:
                        engine: opensearch
    -   asserts:
            -   equal:
                    path: data
                    value:
                        databasePrivateDnsZoneId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/liferay-test/providers/Microsoft.Network/privateDnsZones/privatelink.postgres.database.azure.com
                        databaseSubnetId: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/liferay-test/providers/Microsoft.Network/virtualNetworks/liferay-test-vnet/subnets/liferay-test-database-subnet
                        deploymentName: liferay-test
                        oidcIssuerUrl: https://oidc.example.com/tenant/
                        region: eastus
                        resourceGroupName: liferay-test
                        setup:
                            database:
                                engine: postgresql
                        subscriptionId: 00000000-0000-0000-0000-000000000000
                        tenantId: 33333333-3333-3333-3333-333333333333
            -   equal:
                    path: metadata.annotations["argocd.argoproj.io/sync-wave"]
                    value: "-100"
            -   equal:
                    path: metadata.name
                    value: environment-config
            -   isKind:
                    of: EnvironmentConfig
        it: Renders the environment config with the deployment context and derived network IDs the compositions consume