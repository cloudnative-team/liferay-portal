release:
    name: my-release
    namespace: crossplane-system
suite: Backup Restore ClusterWorkflowTemplate
templates:
    -   charts/liferay-subchart-backup-restore/templates/clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[0].resource.action
                    value: patch
            -   contains:
                    content: --field-manager=liferay-backup-restore
                    path: spec.templates[0].resource.flags
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "apiVersion: liferay.com/v1alpha1"
            -   notMatchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: azure.liferay.com
        it: Binds every composite patch to the field manager ArgoCD tolerates
    -   asserts:
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: \(\[7, \(\[35, \(.spec.backup.retentionDays // 30\)\] \| min\)\] \| max\) as \$retention_days
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: \(\[\$retention_days, \(.spec.backup.retainedDatabaseServerDays // 7\)\] \| min\) as \$retained_days
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: \(now \+ \(\$retained_days \* 86400\)\) \| floor \| todate
            -   contains:
                    content:
                        name: retained-database-server
                        valueFrom:
                            path: /tmp/retained-database-server.txt
                    path: spec.templates[4].outputs.parameters
            -   contains:
                    content:
                        name: retained-database-server-release
                        valueFrom:
                            path: /tmp/retained-database-server-release.txt
                    path: spec.templates[4].outputs.parameters
        it: Clamps the retention deadline to the database backup window
    -   asserts:
            -   equal:
                    path: spec.podMetadata.annotations["karpenter.sh/do-not-disrupt"]
                    value: "true"
        it: Keeps node consolidation from evicting a restore that is still running
    -   asserts:
            -   equal:
                    path: spec.podMetadata.labels["azure.workload.identity/use"]
                    value: "true"
        it: Labels every workflow pod so the workload identity webhook injects a token
    -   asserts:
            -   contains:
                    content:
                        default: "{}"
                        name: retained-database-servers
                    path: spec.templates[0].inputs.parameters
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "retainedDatabaseServers: \\{\\{inputs.parameters.retained-database-servers\\}\\}"
            -   contains:
                    content:
                        name: retained-database-servers
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.retained-database-server}}"
                    path: spec.templates[9].dag.tasks[3].arguments.parameters
            -   contains:
                    content:
                        name: retained-database-servers
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.retained-database-server-release}}"
                    path: spec.templates[9].dag.tasks[7].arguments.parameters
            -   contains:
                    content:
                        name: retained-database-servers
                        value: "{{tasks.get-current-infrastructure-state.outputs.parameters.retained-database-server-release}}"
                    path: spec.templates[9].dag.tasks[8].arguments.parameters
            -   notContains:
                    any: true
                    content:
                        name: retained-database-servers
                    path: spec.templates[9].dag.tasks[0].arguments.parameters
        it: Marks the demoted server retained in the promoting patch and releases it on every roll back
    -   asserts:
            -   contains:
                    content:
                        name: database-server-names
                        valueFrom:
                            path: /tmp/database-server-names.txt
                    path: spec.templates[4].outputs.parameters
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: --selector "retainedDatabaseServer=true"
            -   contains:
                    content:
                        name: database-server-names
                    path: spec.templates[6].inputs.parameters
            -   contains:
                    content:
                        name: restore-source-server-id
                        valueFrom:
                            path: /tmp/restore-source-server-id.txt
                    path: spec.templates[6].outputs.parameters
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: for database_server_name in \$\(echo '\{\{inputs.parameters.database-server-names\}\}' \| jq --raw-output ".\[\]"\)
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: (?s)sort \| tail --lines=1\)" == "\$\{earliest_restore_second\}".*?restore_source_server_id=
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: No database server holds the recovery point time
            -   contains:
                    content:
                        default: "null"
                        name: restore-source-server-id
                    path: spec.templates[0].inputs.parameters
            -   matchRegex:
                    path: spec.templates[0].resource.manifest
                    pattern: "restoreSourceServerId: \\{\\{inputs.parameters.restore-source-server-id\\}\\}"
            -   contains:
                    content:
                        name: restore-source-server-id
                        value: "{{tasks.get-recovery-point-time.outputs.parameters.restore-source-server-id}}"
                    path: spec.templates[9].dag.tasks[4].arguments.parameters
        it: Picks the restore source as the latest lineage that can reach the recovery point
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: az extension add \\\s+--name dataprotection \\\s+--version 1\.11\.3
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: az login \\\s+--federated-token "\$\(cat "\$\{AZURE_FEDERATED_TOKEN_FILE\}"\)"
            -   contains:
                    content:
                        name: AZURE_CONFIG_DIR
                        value: /tmp/azure
                    path: spec.templates[3].script.env
            -   contains:
                    content:
                        name: AZURE_EXTENSION_DIR
                        value: /tmp/azure-extensions
                    path: spec.templates[3].script.env
            -   equal:
                    path: spec.templates[3].script.image
                    value: mcr.microsoft.com/azure-cli:2.89.1
        it: Pins the dataprotection extension and logs in before any az command
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: recovery-point-id
            -   equal:
                    path: spec.entrypoint
                    value: main
            -   equal:
                    path: spec.onExit
                    value: reset-restore-phase
            -   equal:
                    path: spec.serviceAccountName
                    value: backup-restore-service-account
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: \{\{workflow.parameters.recovery-point-id\}\}
        it: Reads the recovery point identifier LCD-53113 declares but does not forward
    -   asserts:
            -   equal:
                    path: spec.templates[6].name
                    value: get-recovery-point-time
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: --query properties.recoveryPointTime
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: "--query \"{earliestRestoreDate: backup.earliestRestoreDate, id: id}\""
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: --query properties.dataSourceInfo.resourceID
        it: Reads the restore point from the recovery point and guards it against the window
    -   asserts:
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: for candidate_backup_instance_name in \$\( \\\s+az dataprotection backup-instance list \\\s+--output tsv \\\s+--query "\[\].name"
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: was not found in the backup vault
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: backup_instance_storage_account_id}" != ".{storage_account_id}"
            -   matchRegex:
                    path: spec.templates[6].script.source
                    pattern: cannot restore a vaulted blob recovery point into the storage account it was taken from
        it: Refuses a recovery point whose document library lives on the target plane
    -   asserts:
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: --selector "dataPlane=\$\{data_plane_inactive\}"
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: still holds a database server that is being released
        it: Refuses a restore while the inactive plane still holds a managed resource
    -   asserts:
            -   equal:
                    path: spec.templates[10].name
                    value: release-retained-database-servers
            -   equal:
                    path: spec.templates[10].script.image
                    value: dtzar/helm-kubectl:4.1.1
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: restore_phase}" != "none"
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: with_entries\(select\(.value \| fromdateiso8601 < now\)\) \| with_entries\(.value = null\)
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: --field-manager=liferay-backup-restore
            -   matchRegex:
                    path: spec.templates[10].script.source
                    pattern: retainedDatabaseServers.*expired_database_servers}}}
        it: Releases retained servers only after their deadline under the restore field manager
    -   asserts:
            -   equal:
                    path: spec.templates[11].name
                    value: reset-restore-phase
            -   matchRegex:
                    path: spec.templates[11].script.source
                    pattern: --field-manager=liferay-backup-restore
            -   matchRegex:
                    path: spec.templates[11].script.source
                    pattern: "\"restorePhase\":\"none\""
        it: Resets the restore phase under the same field manager on exit
    -   asserts:
            -   equal:
                    path: spec.templates[14].name
                    value: restore-document-library-blob
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: --target-resource-id
            -   notMatchRegex:
                    path: spec.templates[14].script.source
                    pattern: --backup-instance-id
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: az dataprotection job show
            -   matchRegex:
                    path: spec.templates[14].script.source
                    pattern: --query properties.status
        it: Restores to the alternate location and gates on the job status
    -   asserts:
            -   equal:
                    path: spec.templates[9].name
                    value: main
            -   equal:
                    path: spec.templates[9].dag.tasks[4].name
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[4].template
                    value: apply-infrastructure
            -   equal:
                    path: spec.templates[9].dag.tasks[6].name
                    value: restore-document-library
            -   equal:
                    path: spec.templates[9].dag.tasks[6].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[10].name
                    value: wait-for-database
            -   equal:
                    path: spec.templates[9].dag.tasks[10].depends
                    value: provision-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].name
                    value: promote-inactive-data-plane
            -   equal:
                    path: spec.templates[9].dag.tasks[3].depends
                    value: restore-document-library && wait-for-database
        it: Runs the database and document library restores as independent legs
    -   asserts:
            -   equal:
                    path: spec.templates[3].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[6].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[14].activeDeadlineSeconds
                    value: 7200
            -   equal:
                    path: spec.templates[18].activeDeadlineSeconds
                    value: 3600
        it: Sets every step timeout well above the measured restore duration
    -   asserts:
            -   equal:
                    path: spec.templates[9].dag.tasks[9].name
                    value: set-data-plane-protection
            -   equal:
                    path: spec.templates[9].dag.tasks[9].depends
                    value: promote-inactive-data-plane
            -   equal:
                    path: spec.templates[17].activeDeadlineSeconds
                    value: 600
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: backup-instance resume-protection
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: backup-instance suspend-backup
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: promoted_state.. == .BackupsSuspended
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: demoted_state.. == .ProtectionConfigured
            -   notMatchRegex:
                    path: spec.templates[17].script.source
                    pattern: stop-protection
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: _wait_for_protection_state
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: (?s)resume-protection.*?--no-wait
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: (?s)suspend-backup.*?--no-wait
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: (?s)function main \{.*?function _wait_for_protection_state \{
            -   matchRegex:
                    path: spec.templates[17].script.source
                    pattern: (?s)function main \{.*?\nmain
        it: Suspends backups on the demoted plane and resumes them on the promoted one
    -   asserts:
            -   equal:
                    path: spec.templates[5].name
                    value: get-inactive-storage-account
            -   matchRegex:
                    path: spec.templates[5].script.source
                    pattern: conditions\[\?\(@.type=='Ready'\)\]
            -   equal:
                    path: spec.templates[3].retryStrategy.retryPolicy
                    value: OnFailure
            -   equal:
                    path: spec.templates[3].retryStrategy.limit
                    value: 5
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: ":lower:"
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "exists}\" == \"false\""
            -   equal:
                    path: spec.templates[3].retryStrategy.backoff.maxDuration
                    value: 20m
        it: Waits only for the storage account and retries past role assignment propagation