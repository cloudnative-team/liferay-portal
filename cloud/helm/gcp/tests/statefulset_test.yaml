suite: StatefulSet
templates:
    -   charts/liferay-default/templates/configmap.yaml
    -   charts/liferay-default/templates/liferay-init-scripts-cm.yaml
    -   charts/liferay-default/templates/liferay-network-cm.yaml
    -   charts/liferay-default/templates/workloads.yaml
tests:
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME
                        value: org.mariadb.jdbc.Driver
                    path: spec.template.spec.containers[0].env
            -   matchRegex:
                    path: spec.template.spec.containers[0].env[?(@.name=="LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL")].value
                    pattern: ^jdbc:mariadb://localhost:3306/lportal$
            -   notMatchRegex:
                    path: spec.template.spec.initContainers[?(@.name=="cloud-sql-proxy")].args[*]
                    pattern: ^--port
        documentSelector:
            path: kind
            value: StatefulSet
        it: Connects to MySQL through the Cloud SQL Auth Proxy on the default port of the engine
        set:
            global.database.engine: mysql
        template: charts/liferay-default/templates/workloads.yaml