release:
    name: my-release
    namespace: my-namespace
suite: Search Allowed Ingress
templates:
    -   templates/search/allowed-ingress.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.ingress[1]
                    value:
                        from:
                            -   podSelector:
                                    matchLabels:
                                        elasticsearch.k8s.elastic.co/cluster-name: my-release-es
                        ports:
                            -   port: 9300
                                protocol: TCP
        it: Allows Elasticsearch nodes to reach each other on the transport port
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    port: 9200
    -   asserts:
            -   equal:
                    path: spec.ingress[2].from
                    value:
                        -   namespaceSelector:
                                matchLabels:
                                    kubernetes.io/metadata.name: client-extension
                            podSelector:
                                matchLabels:
                                    app: one
                        -   namespaceSelector:
                                matchLabels:
                                    kubernetes.io/metadata.name: client-extension
                            podSelector:
                                matchLabels:
                                    app: two
        it: Allows only the labeled pods of the namespace when pod labels are set
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    podLabels:
                        -   app: one
                        -   app: two
                    port: 9200
    -   asserts:
            -   equal:
                    path: spec.ingress[0]
                    value:
                        from:
                            -   namespaceSelector:
                                    matchLabels:
                                        kubernetes.io/metadata.name: my-namespace
                            -   namespaceSelector:
                                    matchLabels:
                                        kubernetes.io/metadata.name: elastic-system
                        ports:
                            -   port: 9200
                                protocol: TCP
        it: Allows the ECK operator and the release namespace to reach the HTTP port
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    port: 9200
    -   asserts:
            -   equal:
                    path: spec.ingress[2]
                    value:
                        from:
                            -   podSelector:
                                    matchLabels:
                                        app.kubernetes.io/name: elasticsearch-exporter
                        ports:
                            -   port: 9200
                                protocol: TCP
            -   lengthEqual:
                    count: 4
                    path: spec.ingress
        it: Allows the exporter to reach the HTTP port when the exporter is enabled
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    port: 9200
            search.elasticsearch.exporter.enabled: true
    -   asserts:
            -   equal:
                    path: spec.ingress[2]
                    value:
                        from:
                            -   namespaceSelector:
                                    matchLabels:
                                        kubernetes.io/metadata.name: client-extension
                        ports:
                            -   port: 9200
                                protocol: TCP
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: spec.podSelector.matchLabels
                    value:
                        elasticsearch.k8s.elastic.co/cluster-name: my-release-es
        it: Allows the whole namespace to reach the Elasticsearch pods on the configured port
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    port: 9200
    -   asserts:
            -   failedTemplate:
                    errorPattern: "\"search.elasticsearch.allowedIngress\\[0\\].namespace\" is required"
        it: Fails when an allowed ingress entry has no namespace
        set:
            search.elasticsearch.allowedIngress:
                -   port: 9200
    -   asserts:
            -   failedTemplate:
                    errorPattern: "\"search.elasticsearch.allowedIngress\\[0\\].port\" is required"
        it: Fails when an allowed ingress entry has no port
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
    -   asserts:
            -   lengthEqual:
                    count: 3
                    path: spec.ingress
            -   notContains:
                    content:
                        from:
                            -   podSelector:
                                    matchLabels:
                                        app.kubernetes.io/name: elasticsearch-exporter
                        ports:
                            -   port: 9200
                                protocol: TCP
                    path: spec.ingress
        it: Omits the exporter rule when the exporter is disabled
        set:
            search.elasticsearch.allowedIngress:
                -   namespace: client-extension
                    port: 9200
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the network policy by default