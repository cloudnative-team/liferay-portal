release:
    name: my-release
    namespace: my-namespace
suite: Elasticsearch
templates:
    -   templates/search/elasticsearch.yaml
    -   templates/search/namespace.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.nodeSets[0].podTemplate.spec.initContainers[1]
                    value:
                        image: busybox:1.36
                        name: extra-init
            -   equal:
                    path: spec.nodeSets[0].podTemplate.spec.containers[0].volumeMounts
                    value:
                        -   mountPath: /extra
                            name: extra
            -   equal:
                    path: spec.nodeSets[0].podTemplate.spec.volumes
                    value:
                        -   emptyDir: {}
                            name: extra
        it: Adds the extra init containers, volume mounts and volumes
        set:
            search.elasticsearch.extraInitContainers:
                -   image: busybox:1.36
                    name: extra-init
            search.elasticsearch.extraVolumeMounts:
                -   mountPath: /extra
                    name: extra
            search.elasticsearch.extraVolumes:
                -   emptyDir: {}
                    name: extra
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   contains:
                    any: true
                    content:
                        name: ES_SETTING_ONE
                        value: one
                    path: spec.nodeSets[0].podTemplate.spec.containers[0].env
            -   contains:
                    any: true
                    content:
                        name: ES_SETTING_TWO
                        value: two
                    path: spec.nodeSets[0].podTemplate.spec.containers[0].env
        documentSelector:
            path: kind
            value: Elasticsearch
        it: Appends every custom env entry through the loop
        set:
            search.elasticsearch.customEnv:
                x-extra:
                    -   name: ES_SETTING_ONE
                        value: one
                    -   name: ES_SETTING_TWO
                        value: two
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   isSubset:
                    content:
                        component: search
                        environmentId: env1
                        projectId: proj1
                        workload_class: standard
                    path: metadata.labels
            -   isSubset:
                    content:
                        component: search
                        environmentId: env1
                        projectId: proj1
                        workload_class: standard
                    path: spec.nodeSets[0].podTemplate.metadata.labels
        it: Labels the Elasticsearch resource and its pods with the search labels
        set:
            environmentId: env1
            projectId: proj1
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   isSubset:
                    content:
                        component: search
                        environmentId: env1
                        name: my-namespace-elasticsearch
                        pod-security.kubernetes.io/enforce: restricted
                        projectId: proj1
                        workload_class: standard
                    path: metadata.labels
        it: Labels the dedicated Elasticsearch namespace with the search labels
        set:
            environmentId: env1
            projectId: proj1
        template: templates/search/namespace.yaml
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: custom-es
        documentSelector:
            path: kind
            value: Elasticsearch
        it: Names the Elasticsearch resource after the configured name override
        set:
            search.elasticsearch.name: custom-es
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-release-es
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: spec.nodeSets[0].count
                    value: 1
            -   equal:
                    path: spec.version
                    value: 8.19.11
            -   isKind:
                    of: Elasticsearch
        documentSelector:
            path: kind
            value: Elasticsearch
        it: Names the Elasticsearch resource after the release and dedicated namespace
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the Elasticsearch resources when search is disabled
        set:
            search.elasticsearch.enabled: false
    -   asserts:
            -   lengthEqual:
                    count: 1
                    path: spec.nodeSets[0].podTemplate.spec.initContainers
            -   notExists:
                    path: spec.nodeSets[0].podTemplate.spec.containers[0].volumeMounts
            -   notExists:
                    path: spec.nodeSets[0].podTemplate.spec.volumes
        it: Omits the extra init containers, volume mounts and volumes by default
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   notExists:
                    path: spec.nodeSets[0].config
        it: Omits the node set config by default
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   equal:
                    path: spec.nodeSets[0].volumeClaimTemplates[0].spec.storageClassName
                    value: hyperdisk-balanced-rwo
        documentSelector:
            path: kind
            value: Elasticsearch
        it: Overrides the data volume storage class
        set:
            persistence.storageClassName: hyperdisk-balanced-rwo
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   equal:
                    path: spec.nodeSets[0].config
                    value:
                        indices.query.bool.max_clause_count: 4096
        it: Passes the node set config through
        set:
            search.elasticsearch.config:
                indices.query.bool.max_clause_count: 4096
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-namespace-elasticsearch
            -   isKind:
                    of: Namespace
        documentSelector:
            path: kind
            value: Namespace
        it: Provisions the dedicated Elasticsearch namespace
        template: templates/search/namespace.yaml
    -   asserts:
            -   hasDocuments:
                    count: 1
        it: Renders the Elasticsearch resource by default
        template: templates/search/elasticsearch.yaml
    -   asserts:
            -   hasDocuments:
                    count: 1
        it: Renders the dedicated Elasticsearch namespace by default
        template: templates/search/namespace.yaml
    -   asserts:
            -   equal:
                    path: spec.nodeSets[0].volumeClaimTemplates[0].spec.storageClassName
                    value: standard-rwo
        documentSelector:
            path: kind
            value: Elasticsearch
        it: Requests the standard-rwo storage class on the data volume by default
        template: templates/search/elasticsearch.yaml