release:
    name: my-release
    namespace: my-namespace
suite: External Secret
templates:
    -   templates/externalsecret.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: my-secret
            -   equal:
                    path: metadata.namespace
                    value: client-extension
            -   equal:
                    path: spec.data[0].remoteRef.key
                    value: my_secret
            -   matchRegex:
                    path: spec.target.template.metadata.annotations["eso.validated-namespace"]
                    pattern: \$expectedNamespace := "client-extension"
        documentIndex: 1
        it: Creates each extension secret in its own namespace
        set:
            extensionSecrets:
                -   names:
                        -   my_secret
                    namespace: client-extension
            secretNames:
                -   liferay
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: liferay
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   matchRegex:
                    path: spec.target.template.metadata.annotations["eso.validated-namespace"]
                    pattern: \$expectedNamespace := "my-namespace"
        documentIndex: 0
        it: Creates each secret name in the release namespace
        set:
            secretNames:
                -   liferay
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the external secrets by default