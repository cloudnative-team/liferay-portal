release:
    name: my-release
    namespace: my-namespace
suite: Search Exporter
templates:
    -   templates/search/exporter/deployment.yaml
    -   templates/search/exporter/network-policy.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.ingress[0].from[0].namespaceSelector.matchLabels
                    value:
                        kubernetes.io/metadata.name: gmp-system
            -   equal:
                    path: spec.podSelector.matchLabels
                    value:
                        app.kubernetes.io/name: elasticsearch-exporter
        it: Allows the managed Prometheus collectors to scrape the exporter
        set:
            search.elasticsearch.exporter.enabled: true
        template: templates/search/exporter/network-policy.yaml
    -   asserts:
            -   isSubset:
                    content:
                        app.kubernetes.io/name: elasticsearch-exporter
                        component: search
                        environmentId: env1
                        projectId: proj1
                        workload_class: standard
                    path: metadata.labels
            -   isSubset:
                    content:
                        app.kubernetes.io/name: elasticsearch-exporter
                        component: search
                        environmentId: env1
                        projectId: proj1
                        workload_class: standard
                    path: spec.template.metadata.labels
        it: Labels the exporter and its pods with the search labels
        set:
            environmentId: env1
            projectId: proj1
            search.elasticsearch.exporter.enabled: true
        template: templates/search/exporter/deployment.yaml
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the exporter by default
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the exporter when search is disabled
        set:
            search.elasticsearch.enabled: false
            search.elasticsearch.exporter.enabled: true
    -   asserts:
            -   contains:
                    content: --es.uri=http://my-release-es-es-http:9200
                    path: spec.template.spec.containers[0].args
            -   equal:
                    path: metadata.namespace
                    value: my-namespace-elasticsearch
            -   equal:
                    path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef
                    value:
                        key: elastic
                        name: my-release-es-es-elastic-user
        it: Scrapes the Elasticsearch cluster with the elastic user credentials
        set:
            search.elasticsearch.exporter.enabled: true
        template: templates/search/exporter/deployment.yaml