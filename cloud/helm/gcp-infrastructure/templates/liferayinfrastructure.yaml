{{- if .Values.enabled -}}
{{- $snapshots := .Values.search.elasticsearch.snapshots -}}

{{- if not (has $snapshots.registration (list "job" "stackConfigPolicy")) -}}
{{- fail "\"search.elasticsearch.snapshots.registration\" must be \"job\" or \"stackConfigPolicy\"" -}}
{{- end -}}

{{- if gt (int $snapshots.retention.minCount) (int $snapshots.retention.maxCount) -}}
{{- fail "\"search.elasticsearch.snapshots.retention.minCount\" must not exceed \"search.elasticsearch.snapshots.retention.maxCount\"" -}}
{{- end -}}

apiVersion: gcp.liferay.com/v1alpha1
kind: LiferayInfrastructure
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-20"
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
spec:
    backup:
        enabled: {{ .Values.backup.enabled }}
        region: {{ .Values.backup.region | quote }}
        retentionDays: {{ .Values.backup.retentionDays }}
        storageClass: {{ .Values.backup.storageClass | quote }}
        vaultTags: {{ .Values.backup.vaultTags | default dict | toYaml | nindent 12 }}
    cmk: {{ .Values.cmk | toYaml | nindent 8 }}
    commonTags:
        environment_id: {{ .Values.environmentId }}
        project_id: {{ .Values.projectId }}
    database:
        {{- $database := .Values.database -}}
        {{- $_ := set $database "rootPasswordSecretName" (printf "%s-db-root-password" .Release.Name) -}}
        {{- $database | toYaml | nindent 8 }}
    environmentId: {{ .Values.environmentId }}
    forceDestroy: {{ .Values.forceDestroy }}
    orphanOnDelete: {{ .Values.orphanOnDelete }}
    overlayAccess:
        enabled: {{ .Values.overlayAccess.enabled }}
    projectId: {{ .Values.projectId }}
    region: {{ .Values.region }}
    search:
        snapshots:
            enabled: {{ and .Values.search.elasticsearch.enabled $snapshots.enabled }}
            indices: {{ $snapshots.indices | quote }}
            registration: {{ $snapshots.registration }}
            retention: {{ $snapshots.retention | toYaml | nindent 16 }}
            schedule: {{ $snapshots.schedule | quote }}
    storage: {{ .Values.storage | toYaml | nindent 8 }}
{{- end -}}