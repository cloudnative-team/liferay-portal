{{- if .Values.enabled -}}
{{- $interval := .Values.podMonitoring.interval -}}
{{- range $name, $instance := .Values.podMonitoring.instances }}
{{- $enabled := "true" }}

{{- if hasKey $instance "enabled" }}
{{- $enabled = tpl (toString $instance.enabled) $ }}
{{- end }}

{{- if eq $enabled "true" }}
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
    name: {{ $name }}
    namespace: {{ tpl ($instance.namespace | default $.Release.Namespace) $ }}
spec:
    endpoints:
        -   interval: {{ $interval }}
            {{- with $instance.metricRelabeling }}
            metricRelabeling:
            {{- range . }}
                -   action: {{ .action }}
                    regex: {{ .regex | replace "\n" "" | replace " " "" | quote }}
                    sourceLabels:
                    {{- range .sourceLabels }}
                        -   {{ . }}
                    {{- end }}
            {{- end }}
            {{- end }}
            {{- with $instance.path }}
            path: {{ . }}
            {{- end }}
            port: {{ $instance.port }}
    selector:
        matchLabels:
            {{- range $k, $v := $instance.matchLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- end -}}