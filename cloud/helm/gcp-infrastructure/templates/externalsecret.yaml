{{- if .Values.enabled }}
{{- $externalSecrets := list }}

{{- range $name := .Values.secretNames }}
{{- $externalSecrets = append $externalSecrets (dict "name" $name "namespace" $.Release.Namespace) }}
{{- end }}

{{- range $entry := .Values.extensionSecrets }}
{{- range $name := $entry.names }}
{{- $externalSecrets = append $externalSecrets (dict "name" $name "namespace" $entry.namespace) }}
{{- end }}
{{- end }}

{{- range $externalSecret := $externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: {{ $externalSecret.name | replace "_" "-" | quote }}
    namespace: {{ $externalSecret.namespace }}
spec:
    data:
        -   remoteRef:
                key: {{ $externalSecret.name | quote }}
                metadataPolicy: Fetch
            secretKey: metadata
        -   remoteRef:
                key: {{ $externalSecret.name | quote }}
            secretKey: data
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ $.Values.secretStoreName | quote }}
    target:
        creationPolicy: {{ $.Values.externalSecretCreationPolicy | quote }}
        deletionPolicy: Retain
        template:
            metadata:
                annotations:
                    eso.validated-namespace: |-
                        {{`
                        {{- $destinationNamespace := index ((.metadata | toString | fromJson).labels | default dict) "esm-app-destination-namespace" -}}
                        {{- $expectedNamespace := `}}{{ $externalSecret.namespace | quote }}{{` -}}

                        {{- if eq $destinationNamespace $expectedNamespace -}}
                        {{- $expectedNamespace -}}
                        {{- else -}}
                        {{- fail (printf "GSM namespace label %q does not match the ExternalSecret namespace %q" $destinationNamespace $expectedNamespace) -}}
                        {{- end -}}
                        `}}
            templateFrom:
                -   literal: |
                        {{`
                        {{- (.metadata | toString | fromJson).annotations | toYaml -}}
                        `}}
                    target: Annotations
                -   literal: |
                        {{`
                        {{- $data := .data | toString -}}

                        {{- if and (hasPrefix "{" $data) (hasSuffix "}" $data) -}}
                        {{- range $k, $v := ($data | fromJson) }}
                        {{ $k }}: {{ $v | toString | quote }}
                        {{- end }}
                        {{- else }}
                        secret: {{ $data | quote }}
                        {{- end -}}
                        `}}
                    target: Data
                -   literal: |
                        {{`
                        {{- (.metadata | toString | fromJson).labels | toYaml -}}
                        `}}
                    target: Labels
{{- end }}
{{- end }}