{{- $search := .Values.search.elasticsearch -}}
{{- if and .Values.enabled $search.enabled $search.exporter.enabled -}}
{{- $searchName := include "search.name" . -}}
{{- $exporter := $search.exporter -}}
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/component: metrics
        app.kubernetes.io/name: elasticsearch-exporter
        {{- include "search.labels" . | nindent 8 }}
    name: {{ $searchName }}-exporter
    namespace: {{ include "search.namespace" . }}
spec:
    replicas: {{ $exporter.replicaCount }}
    selector:
        matchLabels:
            app.kubernetes.io/name: elasticsearch-exporter
    template:
        metadata:
            labels:
                app.kubernetes.io/component: metrics
                app.kubernetes.io/name: elasticsearch-exporter
                {{- include "search.labels" . | nindent 16 }}
        spec:
            automountServiceAccountToken: false
            containers:
                -   args:
                        -   --collector.clustersettings
                        -   --collector.slm
                        -   --collector.snapshots
                        -   --es.all
                        -   --es.indices
                        -   --es.indices_settings
                        -   --es.shards
                        -   --es.timeout=20s
                        -   --es.uri=http://{{ $searchName }}-es-http:9200
                        -   --log.format=json
                        -   --web.listen-address=:9114
                        -   --web.telemetry-path=/metrics
                    env:
                        -   name: ES_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    key: elastic
                                    name: {{ $searchName }}-es-elastic-user
                        -   name: ES_USERNAME
                            value: elastic
                    image: {{ printf "%s:%s" $exporter.image.repository ($exporter.image.tag | toString) }}
                    imagePullPolicy: {{ $exporter.image.pullPolicy }}
                    livenessProbe:
                        {{- toYaml $exporter.livenessProbe | nindent 24 }}
                    name: exporter
                    ports:
                        {{- toYaml $exporter.ports | nindent 24 }}
                    readinessProbe:
                        {{- toYaml $exporter.readinessProbe | nindent 24 }}
                    resources:
                        {{- toYaml $exporter.resources | nindent 24 }}
                    securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                -   ALL
                        readOnlyRootFilesystem: true
            securityContext:
                fsGroup: 65534
                runAsGroup: 65534
                runAsNonRoot: true
                runAsUser: 65534
                seccompProfile:
                    type: RuntimeDefault
{{- end -}}