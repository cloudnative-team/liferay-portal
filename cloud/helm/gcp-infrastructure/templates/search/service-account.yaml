{{- $search := .Values.search.elasticsearch -}}
{{- if and .Values.enabled $search.enabled -}}
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "-25"
    labels:
        {{- include "search.labels" . | nindent 8 }}
    name: elasticsearch
    namespace: {{ include "search.namespace" . }}
{{- end -}}