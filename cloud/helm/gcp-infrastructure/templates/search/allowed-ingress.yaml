{{- $search := .Values.search.elasticsearch -}}
{{- if and .Values.enabled $search.enabled $search.allowedIngress -}}
{{- $searchName := include "search.name" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    labels:
        {{- include "search.labels" . | nindent 8 }}
    name: {{ $searchName }}-allowed-ingress
    namespace: {{ include "search.namespace" . }}
spec:
    ingress:
        -   from:
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: {{ .Release.Namespace }}
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: elastic-system
            ports:
                -   port: 9200
                    protocol: TCP
        -   from:
                -   podSelector:
                        matchLabels:
                            elasticsearch.k8s.elastic.co/cluster-name: {{ $searchName }}
            ports:
                -   port: 9300
                    protocol: TCP
        {{- if $search.exporter.enabled }}
        -   from:
                -   podSelector:
                        matchLabels:
                            app.kubernetes.io/name: elasticsearch-exporter
            ports:
                -   port: 9200
                    protocol: TCP
        {{- end }}
        {{- range $index, $entry := $search.allowedIngress }}
        {{- $namespace := required (printf "\"search.elasticsearch.allowedIngress[%d].namespace\" is required" $index) $entry.namespace }}
        -   from:
                {{- if $entry.podLabels }}
                {{- range $labels := $entry.podLabels }}
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: {{ $namespace }}
                    podSelector:
                        matchLabels:
                            {{- toYaml $labels | nindent 28 }}
                {{- end }}
                {{- else }}
                -   namespaceSelector:
                        matchLabels:
                            kubernetes.io/metadata.name: {{ $namespace }}
                {{- end }}
            ports:
                -   port: {{ required (printf "\"search.elasticsearch.allowedIngress[%d].port\" is required" $index) $entry.port }}
                    protocol: TCP
        {{- end }}
    podSelector:
        matchLabels:
            elasticsearch.k8s.elastic.co/cluster-name: {{ $searchName }}
    policyTypes:
        -   Ingress
{{- end -}}