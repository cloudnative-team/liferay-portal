{{- if include "liferay-client-extension.privateKeyJWT" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        {{- include "liferay-client-extension.labels" . | nindent 8 }}
    name: {{ include "liferay-client-extension.fullname" . }}-oauth2-private-key
rules:
    -   apiGroups:
            -   ""
        resources:
            -   secrets
        verbs:
            -   create
    -   apiGroups:
            -   ""
        resourceNames:
            -   {{ include "liferay-client-extension.oAuth2PrivateKeySecretName" . }}
        resources:
            -   secrets
        verbs:
            -   get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay-client-extension.labels" . | nindent 8 }}
    name: {{ include "liferay-client-extension.fullname" . }}-oauth2-private-key
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "liferay-client-extension.fullname" . }}-oauth2-private-key
subjects:
    -   kind: ServiceAccount
        name: {{ .Values.operatorServiceAccount.name }}
        namespace: {{ .Values.operatorServiceAccount.namespace }}
{{- end }}