{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
    {{- with .Values.serviceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    labels:
        {{- include "operator.labels" . | nindent 8 }}
    name: {{ include "operator.serviceAccountName" . }}
    namespace: {{ include "operator.namespace" . }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        {{- include "operator.labels" . | nindent 8 }}
    name: {{ include "operator.fullname" . }}
rules:
    -   apiGroups:
            -   licensing.liferay.com
        resources:
            -   liferayenvironments
        verbs:
            -   get
            -   list
            -   patch
            -   update
            -   watch
    -   apiGroups:
            -   licensing.liferay.com
        resources:
            -   liferayenvironments/finalizers
        verbs:
            -   update
    -   apiGroups:
            -   licensing.liferay.com
        resources:
            -   liferayenvironments/status
        verbs:
            -   get
            -   patch
            -   update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "operator.labels" . | nindent 8 }}
    name: {{ include "operator.fullname" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "operator.fullname" . }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "operator.serviceAccountName" . }}
        namespace: {{ include "operator.namespace" . }}
{{- end }}