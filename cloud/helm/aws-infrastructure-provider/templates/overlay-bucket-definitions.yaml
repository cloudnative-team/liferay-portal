apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
    annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        argocd.argoproj.io/sync-wave: "-60"
    name: liferayoverlaybuckets.aws.liferay.com
spec:
    group: aws.liferay.com
    names:
        kind: LiferayOverlayBucket
        plural: liferayoverlaybuckets
        shortNames:
            -   lob
        singular: liferayoverlaybucket
    versions:
        -   name: v1alpha1
            referenceable: true
            schema:
                openAPIV3Schema:
                    properties:
                        spec:
                            properties:
                                forceDestroy:
                                    default: false
                                    type: boolean
                                lifecycle:
                                    properties:
                                        abortIncompleteMultipartUploadDays:
                                            default: 7
                                            type: integer
                                        noncurrentVersionExpirationDays:
                                            default: 7
                                            type: integer
                                    type: object
                                projectId:
                                    type: string
                                region:
                                    type: string
                                versioning:
                                    default: true
                                    type: boolean
                            required:
                                -   projectId
                                -   region
                            type: object
                    type: object
            served: true
