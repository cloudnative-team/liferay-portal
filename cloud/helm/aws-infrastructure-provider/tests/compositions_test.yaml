suite: AWS infrastructure provider Composition
templates:
    -   compositions.yaml
tests:
    -   asserts:
            -   isKind:
                    of: Composition
            -   equal:
                    path: spec.compositeTypeRef.kind
                    value: LiferayInfrastructure
            -   equal:
                    path: spec.mode
                    value: Pipeline
            -   equal:
                    path: spec.pipeline[0].step
                    value: liferay-infrastructure
            -   equal:
                    path: spec.pipeline[0].functionRef.name
                    value: function-go-templating
        it: wires the Pipeline-mode Composition for LiferayInfrastructure
