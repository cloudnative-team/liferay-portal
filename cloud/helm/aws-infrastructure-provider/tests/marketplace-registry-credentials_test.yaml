release:
    name: my-release
    namespace: crossplane-system
suite: Marketplace Registry Credentials
templates:
    -   templates/marketplace-registry-credentials.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 2
            -   documentIndex: 0
                isKind:
                    of: ExternalSecret
            -   documentIndex: 0
                equal:
                    path: metadata.namespace
                    value: argocd-system
            -   documentIndex: 0
                equal:
                    path: spec.dataFrom[0].sourceRef.generatorRef
                    value:
                        apiVersion: generators.external-secrets.io/v1alpha1
                        kind: ECRAuthorizationToken
                        name: marketplace-registry
            -   documentIndex: 0
                equal:
                    path: spec.refreshInterval
                    value: 8h
            -   documentIndex: 0
                equal:
                    path: spec.target.template.data
                    value:
                        password: "{{ .password }}"
                        type: oci
                        url: oci://709825985650.dkr.ecr.us-east-1.amazonaws.com
                        username: "{{ .username }}"
            -   documentIndex: 0
                equal:
                    path: spec.target.template.metadata.labels["argocd.argoproj.io/secret-type"]
                    value: repo-creds
            -   documentIndex: 1
                isKind:
                    of: ECRAuthorizationToken
            -   documentIndex: 1
                equal:
                    path: metadata.namespace
                    value: argocd-system
            -   documentIndex: 1
                equal:
                    path: spec
                    value:
                        region: us-east-1
        it: Mints ArgoCD credentials for the AWS Marketplace registry every 8 hours through the External Secrets Operator ECR generator
        set:
            marketplace:
                enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the Marketplace registry credentials by default