release:
    name: my-release
    namespace: crossplane-system
set:
    database:
        engine: postgresql
suite: Database Scripts Environment Config
templates:
    -   templates/database-scripts-environment-config.yaml
tests:
    -   asserts:
            -   equal:
                    path: data.databaseClientImage
                    value: mysql:8.4
            -   matchRegex:
                    path: data.databaseScripts["bootstrap-database.sh"]
                    pattern: CREATE USER IF NOT EXISTS
            -   notExists:
                    path: data.databaseScripts["bootstrap-database.sql"]
        it: Ships the MySQL scripts when the engine is mysql
        set:
            database.engine: mysql
    -   asserts:
            -   equal:
                    path: data.databaseClientImage
                    value: postgres:18-alpine
            -   matchRegex:
                    path: data.databaseScripts["bootstrap-database.sql"]
                    pattern: pg_roles
        it: Ships the PostgreSQL scripts when the engine is postgresql