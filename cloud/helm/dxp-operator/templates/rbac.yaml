{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}
rules:
    {{- include "dxp-operator.rules" (dict "clusterScoped" true "context" . "namespaced" (empty .Values.watchNamespaces)) | trim | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.fullname" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "dxp-operator.fullname" . }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "dxp-operator.serviceAccountName" . }}
        namespace: {{ include "dxp-operator.namespace" . }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        {{- include "dxp-operator.labels" $ | nindent 8 }}
    name: {{ include "dxp-operator.fullname" $ }}
    namespace: {{ . }}
rules:
    {{- include "dxp-operator.rules" (dict "clusterScoped" false "context" $ "namespaced" true) | trim | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "dxp-operator.labels" $ | nindent 8 }}
    name: {{ include "dxp-operator.fullname" $ }}
    namespace: {{ . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "dxp-operator.fullname" $ }}
subjects:
    -   kind: ServiceAccount
        name: {{ include "dxp-operator.serviceAccountName" $ }}
        namespace: {{ include "dxp-operator.namespace" $ }}
{{- end }}
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    {{- with .Values.serviceAccount.annotations }}
    annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    labels:
        {{- include "dxp-operator.labels" . | nindent 8 }}
    name: {{ include "dxp-operator.serviceAccountName" . }}
    namespace: {{ include "dxp-operator.namespace" . }}
{{- end }}