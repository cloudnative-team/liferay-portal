suite: Online Activation ClusterWorkflowTemplate
templates:
    -   templates/online-activation-clusterworkflowtemplate.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the cluster workflow template unless the online activation workflow is enabled
        set:
            onlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: online-activation-cluster-workflow-template
            -   equal:
                    path: spec.serviceAccountName
                    value: online-activation-service-account
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ClusterWorkflowTemplate
        it: Renders one cluster scoped template the whole cluster shares
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: activation-code
            -   notExists:
                    path: spec.arguments.parameters[0].value
        it: Requires the activation code to be supplied at submit time
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: activation-code
            -   lengthEqual:
                    count: 1
                    path: spec.arguments.parameters
        it: Asks the operator for nothing but the activation code
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.templates[0].steps[0][0].name
                    value: find-environment
            -   equal:
                    path: spec.templates[0].steps[1][0].name
                    value: write-secret
            -   equal:
                    path: spec.templates[0].steps[2][0].name
                    value: request-reconcile
            -   equal:
                    path: spec.templates[0].steps[3][0].name
                    value: wait
        it: Finds and validates the environment before writing the activation code
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.templates[1].script.securityContext.allowPrivilegeEscalation
                    value: false
            -   equal:
                    path: spec.templates[1].script.securityContext.capabilities.drop
                    value: ["ALL"]
            -   equal:
                    path: spec.templates[1].script.securityContext.runAsNonRoot
                    value: true
            -   equal:
                    path: spec.templates[1].script.securityContext.seccompProfile.type
                    value: RuntimeDefault
            -   equal:
                    path: spec.securityContext.runAsNonRoot
                    value: true
        it: Hardens the steps for namespaces that enforce the restricted pod security standard
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.archiveLogs
                    value: false
            -   equal:
                    path: spec.podGC.strategy
                    value: OnWorkflowSuccess
            -   equal:
                    path: spec.ttlStrategy.secondsAfterCompletion
                    value: 3600
        it: Discards the workflow that holds the activation code but keeps a failed run readable
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[4].script.env[1].value
                    pattern: "\{\{workflow\.parameters\.activation-code\}\}"
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: "\{\{inputs\.parameters\.liferay-environment-name\}\}"
        it: Leaves the Argo variables intact for the workflow controller to resolve
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.templates[1].outputs.parameters[0].valueFrom.path
                    value: /tmp/liferay-environment-name.txt
            -   equal:
                    path: spec.templates[0].steps[1][0].arguments.parameters[0].value
                    value: "{{steps.find-environment.outputs.parameters.liferay-environment-name}}"
        it: Passes the discovered environment to every step that follows
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[1].script.source
                    pattern: holds no LiferayEnvironment resource to activate
            -   matchRegex:
                    path: spec.templates[1].script.source
                    pattern: but activation requires exactly one
            -   matchRegex:
                    path: spec.templates[1].script.source
                    pattern: Re-activation is not supported
        it: Refuses to act unless the namespace holds exactly one environment to activate
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[1].script.source
                    pattern: The code submitted now will be retried
            -   matchRegex:
                    path: spec.templates[1].script.source
                    pattern: has no phase yet
            -   notMatchRegex:
                    path: spec.templates[1].script.source
                    pattern: activation requires the phase
        it: Retries after a rejected code and tolerates an environment the operator has not reconciled
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "The activation was rejected\."
            -   notMatchRegex:
                    path: spec.templates[3].script.source
                    pattern: echo.*>&2
        it: Reports the activation verdict on standard output so it outlives the pod
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "date \+%s\) \+ 45\)\)"
        it: Substitutes the configured wait timeout into the polling loop
        set:
            onlineActivationWorkflow.enabled: true
            onlineActivationWorkflow.waitTimeoutSeconds: 45