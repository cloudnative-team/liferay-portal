suite: Offline Activation ClusterRole
templates:
    -   templates/offline-activation-rbac.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: offline-activation-cluster-role
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ClusterRole
            -   notExists:
                    path: metadata.namespace
        it: Defines the rules once for every environment in the cluster
        set:
            offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[0].resources
                    value: ["secrets"]
            -   equal:
                    path: rules[0].verbs
                    value: ["get"]
        it: Never writes a secret, because the offline request is the operator's to publish
        set:
            offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the cluster role unless the offline activation workflow is enabled
        set:
            offlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: rules[1].resources
                    value: ["workflowtaskresults"]
            -   equal:
                    path: rules[1].verbs
                    value: ["create", "patch"]
            -   equal:
                    path: rules[2].resources
                    value: ["liferayenvironments"]
            -   equal:
                    path: rules[2].verbs
                    value: ["get", "patch"]
            -   lengthEqual:
                    count: 3
                    path: rules
        it: Reports workflow task results and names the bundle on the environment it activates
        set:
            offlineActivationWorkflow.enabled: true