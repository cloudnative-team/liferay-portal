suite: Online Activation ClusterRole
templates:
    -   templates/online-activation-rbac.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the cluster role unless the online activation workflow is enabled
        set:
            onlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: online-activation-cluster-role
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: ClusterRole
            -   notExists:
                    path: metadata.namespace
        it: Defines the rules once for every environment in the cluster
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[0].resources
                    value: ["secrets"]
            -   equal:
                    path: rules[0].verbs
                    value: ["create"]
            -   equal:
                    path: rules[1].resourceNames
                    value: ["liferay-default-activation"]
            -   equal:
                    path: rules[1].verbs
                    value: ["get", "patch", "update"]
        it: Withholds every secret but the activation code secret from later writes
        set:
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[1].resourceNames
                    value: ["custom-activation"]
        it: Tracks a custom activation code secret name
        set:
            onlineActivationWorkflow.activationCodeSecretName: custom-activation
            onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[2].resources
                    value: ["workflowtaskresults"]
            -   equal:
                    path: rules[2].verbs
                    value: ["create", "patch"]
            -   equal:
                    path: rules[3].resources
                    value: ["liferayenvironments"]
            -   equal:
                    path: rules[3].verbs
                    value: ["get", "list", "patch"]
        it: Reports workflow task results and reads the environments in the bound namespace
        set:
            onlineActivationWorkflow.enabled: true