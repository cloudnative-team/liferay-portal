suite: Marketplace Volume
templates:
    -   charts/liferay-default/templates/liferayenvironment.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.workloadRef.name
                    value: liferay-default
        it: Names the workload on the LiferayEnvironment
        set:
            liferay-default.licensing.enabled: true