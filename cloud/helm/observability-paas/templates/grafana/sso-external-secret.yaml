{{- if .Values.sso.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        {{- include "observability-paas.labels" . | nindent 8 }}
    name: {{ .Values.sso.externalSecret.name | quote }}
    namespace: {{ include "observability-paas.namespace" . | quote }}
spec:
    dataFrom:
        -   extract:
                conversionStrategy: Default
                decodingStrategy: None
                key: {{ .Values.sso.externalSecret.remoteSecretName | quote }}
                metadataPolicy: None
                nullBytePolicy: Ignore
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ .Values.sso.externalSecret.secretStoreName | quote }}
{{- end -}}