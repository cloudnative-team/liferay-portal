{{- if .Values.smtp.enabled -}}
{{- $name := required "observability.grafana.smtp.existingSecret must be set when smtp.enabled is true" (index (index .Subcharts "observability").Subcharts "grafana").Values.smtp.existingSecret -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    labels:
        {{- include "observability-paas.labels" . | nindent 8 }}
    name: {{ $name | quote }}
    namespace: {{ include "observability-paas.namespace" . | quote }}
spec:
    dataFrom:
        -   extract:
                key: {{ .Values.smtp.externalSecret.remoteSecretName | quote }}
    refreshInterval: 1h0m0s
    secretStoreRef:
        kind: ClusterSecretStore
        name: {{ .Values.smtp.externalSecret.secretStoreName | quote }}
    target:
        creationPolicy: Owner
        deletionPolicy: Delete
        immutable: false
        name: {{ $name | quote }}
{{- end -}}