cloudLogging:
    bucketFilter: .*/buckets/workspace
dashboards:
    builds:
        file: dashboards/builds.json
    custom-domains:
        file: dashboards/custom-domains.json
    secrets:
        file: dashboards/secrets.json
fullnameOverride: ""
gateway:
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    enabled: true
    envoy:
        backendTrafficPolicy:
            healthCheck:
                active:
                    healthyThreshold: 1
                    http:
                        path: /api/health
                    interval: 60s
                    type: HTTP
                    unhealthyThreshold: 3
            loadBalancer:
                consistentHash:
                    type: SourceIP
                type: ConsistentHash
            timeout:
                http:
                    requestTimeout: 180s
        clientTrafficPolicy:
            tls:
                ciphers:
                    -   ECDHE-ECDSA-CHACHA20-POLY1305
                    -   ECDHE-RSA-CHACHA20-POLY1305
                    -   ECDHE-ECDSA-AES128-GCM-SHA256
                    -   ECDHE-RSA-AES128-GCM-SHA256
                    -   ECDHE-ECDSA-AES256-GCM-SHA384
                    -   ECDHE-RSA-AES256-GCM-SHA384
                maxVersion: "1.3"
                minVersion: "1.2"
    gatewayClassName: ""
    gke:
        backendPolicy:
            logging:
                enabled: true
                sampleRate: 100000
            sessionAffinity:
                type: CLIENT_IP
            timeoutSec: 180
        gatewayPolicy:
            sslPolicy: restricted
        healthCheck:
            checkIntervalSec: 60
            config:
                httpHealthCheck:
                    requestPath: /api/health
                type: HTTP
            healthyThreshold: 1
            logConfig:
                enabled: true
    name: monitoring-stack-grafana-gateway
    provider: envoy
nameOverride: ""
observability:
    alloy:
        scrape:
            nodeExporter:
                enabled: false
    centralHub:
        monitoringTiles:
            -   emoji: 🏗️
                href: /d/builds/builds
                subtitle: Cloud Build Runs
                title: Builds
            -   emoji: 🔑
                href: /d/secrets/secrets
                subtitle: Managed Secrets
                title: Secrets
            -   emoji: 🌐
                href: /d/custom-domains/custom-domains
                subtitle: Routes and Certificates
                title: Custom Domains
    cloudProvider: gcp
    grafana:
        extraSecretMounts:
            -   defaultMode: 0440
                mountPath: /etc/secrets/grafana_oidc
                name: grafana-oidc
                optional: true
                readOnly: true
                secretName: grafana-oidc
        grafana.ini:
            auth.okta:
                auto_login: false
                enabled: false
                name: Liferay
                use_refresh_token: true
                validate_id_token: true
            server:
                root_url: https://{{ first .Values.route.main.hostnames }}
            smtp:
                ehlo_identity: "{{ first .Values.route.main.hostnames }}"
                enabled: true
                from_address: workspace@liferay.cloud
                from_name: "[CNE] Grafana Alerting"
                host: smtp.sparkpostmail.com:587
                skip_verify: true
            users:
                auto_assign_org_role: Viewer
        networkPolicy:
            allowExternal: false
            enabled: true
            explicitIpBlocks:
                -   35.191.0.0/16
                -   130.211.0.0/22
            ingress: true
        plugins:
            -   googlecloud-logging-datasource
        route:
            main:
                enabled: true
                filters:
                    -   responseHeaderModifier:
                            set:
                                -   name: Strict-Transport-Security
                                    value: max-age=31536000; includeSubDomains; preload
                        type: ResponseHeaderModifier
                hostnames: []
                parentRefs:
                    -   group: gateway.networking.k8s.io
                        kind: Gateway
                        name: monitoring-stack-grafana-gateway
                        sectionName: https
            redirect:
                enabled: true
                hostnames: []
                httpsRedirect: true
                parentRefs:
                    -   group: gateway.networking.k8s.io
                        kind: Gateway
                        name: monitoring-stack-grafana-gateway
                        sectionName: http
        shadowBundledPlugins: true
        smtp:
            existingSecret: grafana-smtp
    kube-state-metrics:
        customResourceState:
            config:
                kind: CustomResourceStateMetrics
                spec:
                    resources:
                        -   groupVersionKind:
                                group: backup.liferay.cloud
                                kind: LiferayBackup
                                version: v1alpha1
                            labelsFromPath:
                                name:
                                    -   metadata
                                    -   name
                                namespace:
                                    -   metadata
                                    -   namespace
                            metrics:
                                -   each:
                                        gauge:
                                            path:
                                                -   status
                                            valueFrom:
                                                -   completionTime
                                        type: Gauge
                                    help: Completion time of the Liferay backup in Unix seconds
                                    name: liferay_backup_completion_time_seconds
                                -   each:
                                        gauge:
                                            path:
                                                -   status
                                            valueFrom:
                                                -   startTime
                                        type: Gauge
                                    help: Start time of the Liferay backup in Unix seconds
                                    name: liferay_backup_start_time_seconds
                                -   each:
                                        gauge:
                                            labelsFromPath:
                                                reason:
                                                    -   reason
                                                type:
                                                    -   type
                                            path:
                                                -   status
                                                -   conditions
                                            valueFrom:
                                                -   status
                                        type: Gauge
                                    help: Liferay backup condition status (1 = True, 0 = False)
                                    name: liferay_backup_status_condition
                        -   groupVersionKind:
                                group: cert-manager.io
                                kind: Certificate
                                version: v1
                            labelsFromPath:
                                name:
                                    -   metadata
                                    -   name
                                namespace:
                                    -   metadata
                                    -   namespace
                            metrics:
                                -   each:
                                        info:
                                            labelsFromPath:
                                                hostname: []
                                            path:
                                                -   spec
                                                -   dnsNames
                                        type: Info
                                    help: Certificate DNS name information, one series per spec.dnsNames entry
                                    name: certificate_dnsname_info
                        -   groupVersionKind:
                                group: gateway.networking.k8s.io
                                kind: HTTPRoute
                                version: v1
                            labelsFromPath:
                                name:
                                    -   metadata
                                    -   name
                                namespace:
                                    -   metadata
                                    -   namespace
                            metrics:
                                -   each:
                                        info:
                                            labelsFromPath:
                                                hostname: []
                                            path:
                                                -   spec
                                                -   hostnames
                                        type: Info
                                    help: HTTPRoute hostname information, one series per spec.hostnames entry
                                    name: httproute_info
        extraArgs:
            -   --metric-allowlist=kube_customresource_certificate_dnsname_info,kube_customresource_httproute_info,kube_customresource_liferay_backup_completion_time_seconds,kube_customresource_liferay_backup_start_time_seconds,kube_customresource_liferay_backup_status_condition,kube_deployment_status_replicas_ready,kube_namespace_labels,kube_node_info,kube_node_status_condition,kube_pod_container_info,kube_pod_container_resource_limits,kube_pod_container_resource_requests,kube_pod_container_status_restarts_total,kube_secret_labels,kube_statefulset_labels,kube_statefulset_status_replicas_ready
            -   --v=1
        metricLabelsAllowlist:
            -   namespaces=[environmentId,liferay.com/observable,projectCustomer]
            -   secrets=[sme-created-at,sme-managed,sme-updated-at,sme-user-create,sme-user-update]
            -   statefulsets=[helm.sh/chart]
        rbac:
            extraRules:
                -   apiGroups:
                        -   backup.liferay.cloud
                    resources:
                        -   liferaybackups
                    verbs:
                        -   list
                        -   watch
                -   apiGroups:
                        -   cert-manager.io
                    resources:
                        -   certificates
                    verbs:
                        -   list
                        -   watch
                -   apiGroups:
                        -   gateway.networking.k8s.io
                    resources:
                        -   httproutes
                    verbs:
                        -   list
                        -   watch
    prometheus-node-exporter:
        enabled: false
prometheus-pushgateway:
    automountServiceAccountToken: false
    enabled: false
    extraArgs:
        -   --log.format=json
        -   --log.level=error
        -   --persistence.file=/data/pushgateway.data
        -   --persistence.interval=1m
    extraContainers:
        -   args:
                -   --sync-period=1m
                -   --ttl=1m
            image: ghcr.io/abatilo/pushgateway-cleaner:v0.1.4
            name: pushgateway-cleaner
            resources:
                limits:
                    cpu: 40m
                    memory: 16Mi
                requests:
                    cpu: 20m
                    memory: 4Mi
    networkPolicy:
        allowAll: true
    resources:
        limits:
            cpu: 100m
            memory: 50Mi
        requests:
            cpu: 100m
            memory: 30Mi
smtp:
    enabled: true
    externalSecret:
        remoteSecretName: lcp_cne_grafana_smtp_json
        secretStoreName: gcpsm-css
sso:
    enabled: false
    externalSecret:
        name: grafana-oidc
        remoteSecretName: okta_sso_oidc_properties_json
        secretStoreName: gcpsm-customer-css