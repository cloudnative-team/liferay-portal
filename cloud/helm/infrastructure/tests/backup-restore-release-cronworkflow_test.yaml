release:
    name: my-release
    namespace: my-namespace
suite: Backup Restore Release CronWorkflow
templates:
    -   templates/backup-restore-release-cronworkflow.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.workflowSpec.podGC.strategy
                    value: OnWorkflowSuccess
            -   equal:
                    path: spec.workflowSpec.ttlStrategy.secondsAfterCompletion
                    value: 86400
        it: Cleans up its pods and expires each run
        set:
            backup.enabled: true
    -   asserts:
            -   equal:
                    path: spec.concurrencyPolicy
                    value: Forbid
            -   equal:
                    path: spec.schedules[0]
                    value: 0 * * * *
            -   equal:
                    path: spec.startingDeadlineSeconds
                    value: 300
        it: Forbids overlapping releases and runs hourly
        set:
            backup.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.labels.component
                    value: backup-restore-platform
            -   equal:
                    path: metadata.name
                    value: backup-restore-release-cron-workflow
            -   equal:
                    path: metadata.namespace
                    value: my-namespace
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: CronWorkflow
        it: Names the cron workflow and its namespace after the release
        set:
            backup.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the cron workflow when backups are disabled
        set:
            backup.enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the cron workflow when the chart is disabled
        set:
            backup.enabled: true
            enabled: false
    -   asserts:
            -   equal:
                    path: spec.workflowSpec.entrypoint
                    value: main
            -   equal:
                    path: spec.workflowSpec.templates[0].steps[0][0].templateRef.clusterScope
                    value: true
            -   equal:
                    path: spec.workflowSpec.templates[0].steps[0][0].templateRef.name
                    value: backup-restore-cluster-workflow-template
            -   equal:
                    path: spec.workflowSpec.templates[0].steps[0][0].templateRef.template
                    value: release-retained-database-servers
            -   notExists:
                    path: spec.workflowSpec.onExit
            -   notExists:
                    path: spec.workflowSpec.workflowTemplateRef
        it: References the release template without inheriting the restore exit hook
        set:
            backup.enabled: true
    -   asserts:
            -   equal:
                    path: spec.workflowSpec.serviceAccountName
                    value: backup-restore-service-account
        it: Runs as the backup restore service account
        set:
            backup.enabled: true