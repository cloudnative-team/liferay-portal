{{- $delivery := .Values.clientExtensions.delivery -}}
{{- if $delivery.enabled -}}
# Lets the DXP operator write client extension configuration into this
# namespace, and only this one. Which namespaces' client extensions it may
# deliver is still decided by the allowed-client-extension-namespaces
# annotation on this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "liferay.labels" . | nindent 8 }}
    name: client-extension-delivery-role-binding
    namespace: {{ include "liferay.namespace" . }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ $delivery.clusterRoleName }}
subjects:
    -   kind: ServiceAccount
        name: {{ $delivery.operatorServiceAccount.name }}
        namespace: {{ $delivery.operatorServiceAccount.namespace }}
{{- end -}}