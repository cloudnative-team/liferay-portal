suite: Online Activation WorkflowTemplate
templates:
    -   templates/online-activation-workflowtemplate.yaml
tests:
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the workflow template when licensing is disabled
        set:
            licensing.enabled: false
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the workflow template when the online activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: online-activation-workflow-template
            -   equal:
                    path: spec.serviceAccountName
                    value: online-activation-service-account
            -   hasDocuments:
                    count: 1
            -   isKind:
                    of: WorkflowTemplate
        it: Renders the workflow template when licensing and the workflow are both enabled
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].name
                    value: activation-code
            -   notExists:
                    path: spec.arguments.parameters[0].value
        it: Requires the activation code to be supplied at submit time
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[1].name
                    value: liferay-environment-name
            -   equal:
                    path: spec.arguments.parameters[1].value
                    value: liferay-default
        it: Defaults the environment parameter to the environment the chart renders
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.templates[0].steps[0][0].name
                    value: verify-pending
            -   equal:
                    path: spec.templates[0].steps[1][0].name
                    value: write-secret
            -   equal:
                    path: spec.templates[0].steps[2][0].name
                    value: request-reconcile
            -   equal:
                    path: spec.templates[0].steps[3][0].name
                    value: wait
        it: Guards against re-activation before writing the activation code
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.templates[1].script.securityContext.allowPrivilegeEscalation
                    value: false
            -   equal:
                    path: spec.templates[1].script.securityContext.capabilities.drop
                    value: ["ALL"]
            -   equal:
                    path: spec.templates[1].script.securityContext.runAsNonRoot
                    value: true
            -   equal:
                    path: spec.templates[1].script.securityContext.seccompProfile.type
                    value: RuntimeDefault
            -   equal:
                    path: spec.securityContext.runAsNonRoot
                    value: true
        it: Hardens the steps for namespaces that enforce the restricted pod security standard
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.archiveLogs
                    value: false
            -   equal:
                    path: spec.podGC.strategy
                    value: OnPodCompletion
            -   equal:
                    path: spec.ttlStrategy.secondsAfterCompletion
                    value: 3600
        it: Discards the pods and the workflow that hold the activation code
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[4].script.env[1].value
                    pattern: "\{\{workflow\.parameters\.activation-code\}\}"
            -   matchRegex:
                    path: spec.templates[4].script.source
                    pattern: "\{\{workflow\.parameters\.liferay-environment-name\}\}"
        it: Leaves the Argo variables intact for the workflow controller to resolve
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
    -   asserts:
            -   matchRegex:
                    path: spec.templates[3].script.source
                    pattern: "date \+%s\) \+ 45\)\)"
        it: Substitutes the configured wait timeout into the polling loop
        set:
            licensing.enabled: true
            licensing.onlineActivationWorkflow.enabled: true
            licensing.onlineActivationWorkflow.waitTimeoutSeconds: 45