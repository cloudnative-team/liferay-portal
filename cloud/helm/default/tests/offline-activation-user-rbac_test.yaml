release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Offline Activation User RBAC
templates:
    -   templates/offline-activation-user-rbac.yaml
tests:
    -   asserts:
            -   equal:
                    path: roleRef.kind
                    value: Role
            -   equal:
                    path: roleRef.name
                    value: offline-activation-user-role
            -   equal:
                    path: subjects[0].name
                    value: offline-activation-user-service-account
            -   equal:
                    path: subjects[0].namespace
                    value: liferay-acme-prd
        documentSelector:
            path: kind
            value: RoleBinding
        it: Binds the customer identity to this namespace and no other
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[0].resources
                    value: ["events", "pods", "pods/log"]
            -   equal:
                    path: rules[0].verbs
                    value: ["get", "list", "watch"]
        documentSelector:
            path: kind
            value: Role
        it: Lets the customer read the logs that carry the offline activation request
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the user RBAC when licensing is disabled
        set:
            licensing.enabled: false
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the user RBAC when the offline activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: metadata.annotations["kubernetes.io/service-account.name"]
                    value: offline-activation-user-service-account
            -   equal:
                    path: metadata.name
                    value: offline-activation-user-token
            -   equal:
                    path: type
                    value: kubernetes.io/service-account-token
        documentSelector:
            path: kind
            value: Secret
        it: Mints the bearer token the customer pastes into the Argo Workflows UI
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 4
        it: Renders the role, its binding, the service account, and the token together
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: rules[2].resources
                    value: ["workflows"]
            -   equal:
                    path: rules[2].verbs
                    value: ["create", "delete", "get", "list", "patch", "update", "watch"]
            -   equal:
                    path: rules[1].verbs
                    value: ["get", "list", "watch"]
            -   contains:
                    content: workflowtemplates
                    path: rules[1].resources
        documentSelector:
            path: kind
            value: Role
        it: Submits workflows but never edits the template that defines them
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: custom-user-role
        documentSelector:
            path: kind
            value: Role
        it: Tracks a custom user role name
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
            licensing.offlineActivationWorkflow.userAccess.roleName: custom-user-role