release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Offline Activation RBAC
templates:
    -   templates/offline-activation-rbac.yaml
tests:
    -   asserts:
            -   equal:
                    path: metadata.annotations["eks.amazonaws.com/role-arn"]
                    value: arn:aws:iam::123456789012:role/acme-irsa
        documentSelector:
            path: kind
            value: ServiceAccount
        it: Carries the cloud identity the workflow assumes to read the uploaded bundle
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
            licensing.offlineActivationWorkflow.serviceAccountAnnotations:
                eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/acme-irsa
    -   asserts:
            -   equal:
                    path: roleRef.kind
                    value: ClusterRole
            -   equal:
                    path: roleRef.name
                    value: offline-activation-cluster-role
            -   equal:
                    path: subjects[0].name
                    value: offline-activation-service-account
            -   equal:
                    path: subjects[0].namespace
                    value: liferay-acme-prd
        documentSelector:
            path: kind
            value: RoleBinding
        it: Confines the shared cluster role to this namespace through a namespaced binding
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: offline-activation-service-account
            -   equal:
                    path: metadata.namespace
                    value: liferay-acme-prd
            -   notExists:
                    path: metadata.annotations
        documentSelector:
            path: kind
            value: ServiceAccount
        it: Creates the service account in the environment namespace, where the workflow pod runs
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the RBAC when licensing is disabled
        set:
            licensing.enabled: false
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the RBAC when the offline activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: false
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders only the identity the workflow needs in this namespace
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: roleRef.name
                    value: custom-cluster-role
        documentSelector:
            path: kind
            value: RoleBinding
        it: Tracks a custom cluster role name
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.clusterRoleName: custom-cluster-role
            licensing.offlineActivationWorkflow.enabled: true