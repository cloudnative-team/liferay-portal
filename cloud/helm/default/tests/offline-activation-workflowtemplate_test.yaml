release:
    name: liferay-default
    namespace: liferay-acme-prd
suite: Offline Activation WorkflowTemplate
templates:
    -   templates/offline-activation-workflowtemplate.yaml
tests:
    -   asserts:
            -   equal:
                    path: spec.templates[0].steps[0][0].templateRef.clusterScope
                    value: true
            -   equal:
                    path: spec.templates[0].steps[0][0].templateRef.name
                    value: offline-activation-cluster-workflow-template
            -   equal:
                    path: spec.templates[0].steps[0][0].templateRef.template
                    value: main
        documentSelector:
            path: metadata.name
            value: offline-activation-workflow-template
        it: Defers the activation logic to the template the operator chart installs once
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.parameters[0].value
                    value: liferay-default
        documentSelector:
            path: metadata.name
            value: offline-activation-request-workflow-template
        it: Fills the request template with this release's environment name
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.volumes[0].name
                    value: marketplace
            -   equal:
                    path: spec.volumes[0].persistentVolumeClaim.claimName
                    value: liferay-default-marketplace
            -   lengthEqual:
                    count: 1
                    path: spec.volumes
        documentSelector:
            path: metadata.name
            value: offline-activation-workflow-template
        it: Names the marketplace claim here, where the release name is known
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   notExists:
                    path: spec.volumes
            -   notExists:
                    path: spec.arguments.artifacts
        documentSelector:
            path: metadata.name
            value: offline-activation-request-workflow-template
        it: Needs neither an upload nor the marketplace volume to read the request
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the workflow templates when licensing is disabled
        set:
            licensing.enabled: false
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 0
        it: Omits the workflow templates when the offline activation workflow is disabled
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: false
    -   asserts:
            -   equal:
                    path: metadata.namespace
                    value: liferay-acme-prd
            -   equal:
                    path: spec.serviceAccountName
                    value: offline-activation-service-account
            -   isKind:
                    of: WorkflowTemplate
        documentSelector:
            path: metadata.name
            value: offline-activation-workflow-template
        it: Places the namespaced template where the Argo Workflows UI lists it
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   hasDocuments:
                    count: 2
        it: Renders one template to collect the request and one to activate with the bundle
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: spec.arguments.artifacts[0].name
                    value: offline-activation-bundle
            -   equal:
                    path: spec.templates[0].inputs.artifacts[0].name
                    value: offline-activation-bundle
            -   equal:
                    path: spec.templates[0].steps[0][0].arguments.artifacts[0].from
                    value: "{{inputs.artifacts.offline-activation-bundle}}"
            -   notExists:
                    path: spec.arguments.artifacts[0].s3
        documentSelector:
            path: metadata.name
            value: offline-activation-workflow-template
        it: Requires the artifact the submit dialog uploads and passes it through untouched
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
    -   asserts:
            -   equal:
                    path: metadata.name
                    value: custom-offline-activation
        documentSelector:
            path: spec.arguments.artifacts[0].name
            value: offline-activation-bundle
        it: Tracks a custom workflow template name
        set:
            licensing.enabled: true
            licensing.offlineActivationWorkflow.enabled: true
            licensing.offlineActivationWorkflow.workflowTemplateName: custom-offline-activation